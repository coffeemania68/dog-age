<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견종별 강아지 나이로 이동합니다</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://coffeemania68.github.io/dog-age/breeds/">
<script>
  // 옛 주소(breed-detail.html?breed=이름)를 새 견종 페이지로 보낸다
  (function () {
    var name = new URLSearchParams(location.search).get('breed');
    var s = document.createElement('script');
    s.src = 'assets/data.js';
    s.onload = function () {
      var b = (window.BREEDS || []).filter(function (x) { return x.name === name; })[0];
      location.replace(b ? 'breeds/' + b.slug + '/' : 'breeds/');
    };
    s.onerror = function () { location.replace('breeds/'); };
    document.head.appendChild(s);
  })();
</script>
</head>
<body><p><a href="breeds/">견종별 강아지 나이로 이동</a></p></body>
</html>
